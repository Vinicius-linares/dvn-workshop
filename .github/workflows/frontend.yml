# ADR-0006 — CI pipeline for the frontend application.
name: frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dvn-workshop-apps/frontend/**"

permissions:
  contents: write

concurrency:
  group: kustomize-writeback
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 934384776856.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: dvn-frontend
  APP_CONTEXT: dvn-workshop-apps/frontend/youtube-live-app
  KUSTOMIZE_VERSION: v5.4.3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_CONTEXT }}
          file: ${{ env.APP_CONTEXT }}/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kustomize ${{ env.KUSTOMIZE_VERSION }}
        run: |
          curl -sSfLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${{ env.KUSTOMIZE_VERSION }}/kustomize_${{ env.KUSTOMIZE_VERSION }}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update kustomization.yaml with new frontend image tag
        working-directory: dvn-workshop-kubernetes
        run: |
          kustomize edit set image dvn-workshop/production/frontend=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Commit and push manifest write-back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dvn-workshop-kubernetes/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(cd): frontend image -> ${{ github.sha }} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
