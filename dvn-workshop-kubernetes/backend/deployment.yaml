apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend
    app.kubernetes.io/version: "v1"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: dvn-workshop
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: backend
        app.kubernetes.io/version: "v1"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: dvn-workshop
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: backend
          # A tag é gerenciada centralmente pelo kustomization.yaml (bloco images:).
          image: dvn-workshop/production/backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          # Readiness: remove o Pod dos endpoints do Service quando não estiver pronto (sem reinício).
          readinessProbe:
            httpGet:
              path: /backend/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: reinicia o container se travar. Endpoint barato (/backend/health).
          livenessProbe:
            httpGet:
              path: /backend/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # A imagem roda como usuário não-root 'app' (nome, não número). Com runAsNonRoot,
          # o kubelet exige um UID NUMÉRICO para provar que não é root — por isso runAsUser: 1654
          # (UID do usuário 'app' nas imagens .NET 8+).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
